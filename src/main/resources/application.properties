spring.application.name=organizador-contas

# Carrega os segredos do arquivo .env (na raiz do projeto). Esse arquivo NUNCA vai para o GitHub.
spring.config.import=optional:file:.env[.properties]

# --- Banco de dados ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/organizador_contas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# --- E-mail (Resend) ---
resend.api.key=${RESEND_API_KEY}

# --- Login (JWT) ---
jwt.secret=${JWT_SECRET}
jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:10}

# --- Endereços do sistema (usados nos links dos e-mails) ---
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.backend.url=${BACKEND_URL:http://localhost:8080}